services:
  hitchlet:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /var/lib/hitchlet
      GUI_DIR: /app/gui
    volumes:
      - hitchlet-data:/var/lib/hitchlet
volumes:
  hitchlet-data:
