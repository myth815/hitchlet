services:
  hitchlet:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /var/lib/hitchlet
      GUI_DIR: /app/gui
      EXECUTION_MODE: disabled
      COOKIE_SECURE: "true"
      DISK_LOW_WATER_MIB: ${DISK_LOW_WATER_MIB:-1024}
      DISK_RESERVE_MIB: ${DISK_RESERVE_MIB:-128}
      IMAGE_PULL_BUDGET_MIB: ${IMAGE_PULL_BUDGET_MIB:-8192}
      BACKUP_DAILY_COPIES: ${BACKUP_DAILY_COPIES:-7}
      BACKUP_WEEKLY_COPIES: ${BACKUP_WEEKLY_COPIES:-4}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_FILES: ${LOG_FILES:-5}
    volumes:
      - hitchlet-data:/var/lib/hitchlet
volumes:
  hitchlet-data:
